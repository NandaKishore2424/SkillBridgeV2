# ============================================================================
# Main application configuration
# ============================================================================
# NO SECRET MAY EVER APPEAR IN THIS FILE. Not as a default, not in a comment,
# not "temporarily". This file is committed to git; anything in it is public to
# everyone with repository access, and stays in the history after removal.
#
# Every credential below is read from the environment and has no fallback, so a
# missing variable fails loudly at startup rather than silently starting with a
# known-bad default. See .env.example for the full list.
# ============================================================================

spring:
  # Only the timeouts. The host is deliberately unset here: Spring creates a
  # JavaMailSender only when spring.mail.host exists, and MailConfig refuses to
  # start with provider SMTP and no sender. Bounded because an admin waits on
  # an invitation.
  mail:
    properties:
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000
  application:
    name: skillbridge-backend

  # CSV import is the only upload. 1 MB is about 10,000 student rows, well past
  # app.import.max-rows, and the importer holds the file in memory for its run.
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB

  # Active profile. Override with SPRING_PROFILES_ACTIVE.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

    # Hikari defaults assume a connection stays open until Hikari retires it.
    # Supabase sits behind a pooler that closes idle server connections on its
    # own schedule, so a pool left on defaults hands out sockets the server has
    # already dropped. The symptom is a 500 on the first request after an idle
    # period -- "An I/O error occurred while sending to the backend" -- which
    # then succeeds on retry and so reads as a flake rather than a bug.
    hikari:
      # Ping idle connections so a dead one is discovered and replaced by the
      # pool rather than by a user's request. This is the setting that actually
      # fixes the symptom above.
      keepalive-time: 120000      # 2m
      # Retire connections well inside the pooler's idle window rather than
      # Hikari's 30-minute default.
      max-lifetime: 900000        # 15m
      # Inert while minimum-idle == maximum-pool-size (a fixed-size pool never
      # retires an idle connection). It applies again if DB_POOL_MIN is lowered.
      idle-timeout: 300000        # 5m

      # ---- Sizing. Measured 2026-09-09; see docs/CONNECTION_POOL.md ----------
      # The ceiling is not this application's choice. Supabase fronts the
      # database with Supavisor, and this project's pooler allows exactly 15
      # server connections: configured at 30, given a 48-second load with 26
      # requests queued, hikaricp.connections.active never once exceeded 15, and
      # pg_stat_activity agreed. Anything above 15 here is unreachable
      # configuration -- Hikari would queue rather than grow, while advertising
      # capacity that cannot exist.
      #
      # Those 15 are shared. skillbridge-ai-service and the ETL pipeline use the
      # same pooler host, port and role. Their configured maximums were 10 and 1,
      # which with this pool's previous 10 claimed 21 against a ceiling of 15 --
      # already oversubscribed by 40%.
      #
      # 12 is this service's share: it is the only latency-critical, user-facing
      # claimant, and 3 are left for the AI service (best effort, its own code
      # says 2 is plenty) and the ETL script (1, single connection).
      #
      # Fixed size on purpose -- minimum-idle equals maximum-pool-size. Creating
      # a connection to the pooler measured a 1171 ms mean: TCP, TLS, Supavisor
      # auth and Postgres auth, each a round trip to ap-northeast-2. Letting the
      # pool grow on the request path puts that second-plus in a user's latency,
      # so the pool is warm before anyone asks.
      minimum-idle: ${DB_POOL_MIN:12}
      maximum-pool-size: ${DB_POOL_MAX:12}

      # Shed load rather than queue behind an exhausted pool: 30 seconds of
      # waiting is 30 seconds of a held Tomcat thread, which turns a slow
      # service into an unresponsive one.
      #
      # Not the 3000 ms the phase doc suggests. Connection creation measured a
      # 1171 ms mean here, so a 3-second budget leaves under two creation times
      # of headroom, and a request arriving during warm-up or while Hikari
      # replaces a retired connection would fail rather than wait. 5000 is four
      # times the measured creation cost and still six times tighter than the
      # 30 s it replaces.
      connection-timeout: 5000
      validation-timeout: 3000    # must stay under connection-timeout

      # Statement timeout, set once per connection as it is opened.
      #
      # Without it a pathological query holds one of twelve connections until
      # the client gives up, and a JDBC client left waiting on a socket gives up
      # when the TCP stack does -- which can be many minutes. Two or three of
      # those and interactive traffic has nothing left to check out.
      #
      # 30 s rather than something tighter: the slowest legitimate read here is
      # the audit log's keyset page against a database a round trip away, and the
      # instance has been observed taking 500-650 ms per statement while
      # throttled. This is a backstop against a query that will never finish, not
      # a performance budget -- docs/PERFORMANCE_BUDGET.md is that.
      #
      # idle_in_transaction_session_timeout is the other half and the one that
      # bites harder: a transaction left open holds its connection *and* blocks
      # vacuum on every row it touched. Sixty seconds is far longer than any
      # transaction here legitimately runs.
      connection-init-sql: "SET statement_timeout = '30s'; SET idle_in_transaction_session_timeout = '60s'"

      # A connection out of the pool for 20 s has been leaked, not used: the
      # slowest single checkout observed under deliberate overload was 4.5 s.
      # This only logs -- it never fails a request -- so a false positive costs
      # a log line, and the alternative is finding leaks by running out.
      leak-detection-threshold: 20000

      # Name the pool so the Micrometer gauges are labelled, and name the JDBC
      # connections so they are attributable on the server. Without
      # ApplicationName every one of our sockets shows up in pg_stat_activity as
      # the driver's default "PostgreSQL JDBC Driver", which is what the AI
      # service and the ETL pipeline are called too -- so on a shared 60-
      # connection server you cannot tell whose connections are holding the
      # ceiling. Measured 2026-09-09: our two idle connections were
      # indistinguishable from any other JDBC client's.
      pool-name: SkillBridgeHikari
      data-source-properties:
        ApplicationName: skillbridge-backend
        # Collapse a batch of INSERTs into one multi-row statement. With every
        # round trip costing ~150 ms to ap-northeast-2, the batch size Hibernate
        # is configured for below is only worth having if the driver sends it as
        # one statement.
        reWriteBatchedInserts: true
        # Server-side prepared statements after 5 executions, cached so the
        # server does not re-plan. Saves a parse/plan round trip on every
        # repeated query, which at this latency is the cost that matters.
        #
        # SAFE ONLY IN SESSION MODE. This connects to the pooler on port 5432,
        # which is Supavisor's session mode: one client connection owns one
        # server connection, so a prepared statement stays where it was made.
        # Port 6543 is transaction mode, where a connection is handed to a
        # different client between statements and named prepared statements
        # break. Changing that port without removing these two lines is a
        # one-character change that fails at runtime, not at startup.
        prepareThreshold: 5
        preparedStatementCacheQueries: 256
        preparedStatementCacheSizeMiB: 5
        # Stream large result sets rather than materialising them in the heap.
        defaultRowFetchSize: 500

  rabbitmq:
    addresses: ${AMQP_URL}
    # A broker that has gone away must not hold a thread. Without these the
    # client waits on the socket's own defaults, which on a dropped connection
    # means minutes. Since the outbox (Phase 09) the only thread that publishes
    # is OutboxRelay's, and it holds no database connection while it does.
    connection-timeout: 5000
    # Publisher confirms. `convertAndSend` returning means the bytes reached a
    # local socket buffer, not that the broker accepted them.
    #
    # CORRELATED, not SIMPLE. SIMPLE with waitForConfirmsOrDie was tried first and
    # an unroutable event came back confirmed before the returns callback had run,
    # so the relay marked it PUBLISHED -- OutboxRelayBrokerTest caught it against
    # a real broker. CORRELATED puts the ack and the returned message on the same
    # CorrelationData, so one object answers "accepted?" and "routed?".
    publisher-confirm-type: correlated
    # With mandatory, an event that matches no queue is RETURNED rather than
    # silently dropped: the broker acks it either way, so without returns an
    # unroutable event would be confirmed and marked published and gone.
    publisher-returns: true
    template:
      reply-timeout: 10000
      mandatory: true

  mvc:
    async:
      # Bounds a request that dispatches to another thread and never comes back.
      # Nothing here returns a Callable or DeferredResult today; this is the
      # ceiling for the first one that does, so it arrives bounded rather than
      # inheriting Tomcat's indefinite default.
      request-timeout: 30s

  data:
    web:
      pageable:
        # No controller uses Spring's Pageable resolver today -- they read page
        # and size as request params and go through common.dto.Pagination, which
        # applies the same ceiling. This is here so a controller that does start
        # using Pageable is capped from the first line rather than the second.
        max-page-size: 100
        default-page-size: 20

  # Schema migrations. Reinstated 2026-09-19, when the project moved off Supabase
  # and gained a second environment to reproduce (a laptop now, an EC2 host
  # later). Flyway runs before JPA starts, so `ddl-auto: validate` below checks
  # the entities against the schema Flyway just produced.
  #
  # To change the schema: add src/main/resources/db/migration/V<next>__<what>.sql
  # and change the entity in the same commit. Never edit an applied migration;
  # Flyway checksums them and refuses to start if one changes.
  flyway:
    enabled: true
    locations: classpath:db/migration
    # A database that already holds the schema but has no Flyway history -- the
    # local database restored from the 2026-09-19 backup, and the EC2 database
    # restored from the same dump -- is recorded as being at V2 (schema plus
    # reference data) rather than re-created. V1 and V2 were generated from the
    # capture that dump was verified against, so "at V2" is a fact, not a hope.
    # An empty database, which is what the integration tests start with, runs
    # V1 and V2 from scratch.
    baseline-on-migrate: true
    baseline-version: "2"
    baseline-description: "restored from the 2026-09-19 Supabase backup"
    validate-on-migrate: true

  jpa:
    # validate, never update. Hibernate must not be allowed to alter the schema:
    # it would not create the trg_progress_denorm trigger, the partial unique
    # indexes or the CHECK constraints this schema depends on, and it never
    # removes anything. Flyway owns the schema; this is the second guard that the
    # entities and the migrations agree -- it is what caught both startup bugs
    # that blocked Phase 00.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

        # Hibernate's statistics counter, which is how QueryCountAssertion sees
        # how many statements a call emits. It is what makes an N+1 a test
        # failure instead of something you notice in production.
        #
        # On in every profile on purpose. The overhead is a handful of atomic
        # counters -- Hibernate's own docs call it negligible -- and the
        # alternative is a guard that only works where it is already switched
        # on, which is never the environment where the surprise happens. It also
        # feeds the JMX/actuator hibernate metrics for free.
        generate_statistics: true
        # Statistics on their own log a summary per session at INFO, which is
        # noise. The logger is muted in the logging block below; the counters
        # stay live.

logging:
  level:
    # Statistics are collected (see generate_statistics) but the per-session
    # summary Hibernate logs is not wanted in normal output.
    org.hibernate.stat: WARN

jwt:
  secret: ${JWT_SECRET}

  # THIS IS THE REVOCATION WINDOW, not just a session length.
  #
  # Since 2026-09-09 TokenAuthenticationFilter builds the principal from the
  # token's claims instead of reloading the user on every request. That removed a
  # database round trip -- ~150 ms, under every authenticated endpoint, one of the
  # two connection checkouts a request made -- and gave up the property that paid
  # for it: a deactivated user used to lose access on their very next request, and
  # now keeps it until their access token expires.
  #
  # So this number is how long a deactivated or demoted user keeps working. An
  # hour was defensible when the filter re-read the user and this value only
  # controlled how often clients refreshed; it is not defensible as a revocation
  # window. Fifteen minutes bounds it while costing each active client four
  # refreshes an hour, against the one lookup per request it replaces.
  #
  # The bound is real rather than best-effort: /auth/refresh re-reads the user and
  # refuses an inactive one, so a deactivated user cannot extend past the token
  # they already hold.
  #
  # Lower it if that window is too wide; the cost is refresh traffic, and each
  # refresh also rotates the refresh token, so it is two writes rather than a
  # read.
  accessTokenTtlSeconds: ${JWT_ACCESS_TTL:900}      # 15m
  refreshTokenTtlSeconds: ${JWT_REFRESH_TTL:1209600}

  # A rotated-away refresh token presented again within this many seconds is
  # treated as two tabs racing (they share one cookie jar): refused, but the
  # session family is left alone. After it, reuse is treated as theft and the
  # whole family, plus every access token the user holds, is revoked. See
  # AuthService.
  refreshReuseGraceSeconds: ${JWT_REFRESH_REUSE_GRACE:10}

rateLimit:
  requestsPerMinute: ${RATE_LIMIT_RPM:120}

app:
  auth:
    # The refresh cookie's Secure flag. On by default: the cookie must never
    # travel over plain http. Only local development over http://localhost
    # turns it off (application-local.yaml).
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}
    # How long an invitation's temporary password works. Enforced at login and
    # at first-login; after it, the admin resends the invitation.
    invitation-ttl: ${INVITATION_TTL:7d}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  import:
    # Rows per CSV file. Each row is a bcrypt hash and three inserts, so this
    # bounds how long one upload occupies an import thread.
    max-rows: ${IMPORT_MAX_ROWS:2000}
    # An upload whose importer has not reported progress for this long is
    # declared dead (StaleUploadSweeper).
    stale-after: 10m
  mail:
    # LOG sends nothing and records only recipient and subject, so the app starts
    # anywhere. SMTP needs spring.mail.host (SPRING_MAIL_HOST, SPRING_MAIL_PORT):
    # Mailpit from docker-compose is localhost:1025. RESEND needs RESEND_API_KEY
    # and a domain verified with Resend.
    provider: ${MAIL_PROVIDER:LOG}
    from: ${MAIL_FROM:SkillBridge <no-reply@skillbridge.local>}
    login-url: ${MAIL_LOGIN_URL:http://localhost:5173/first-login}
    resend:
      api-key: ${RESEND_API_KEY:}
      base-url: ${RESEND_BASE_URL:https://api.resend.com}

management:
  endpoints:
    web:
      exposure:
        # metrics/prometheus carry the Hikari pool gauges. The one that matters
        # is hikaricp.connections.pending: any sustained non-zero value means
        # requests are queueing for a connection, and it goes non-zero well
        # before anyone reports slowness.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: skillbridge

# OpenAPI. The JSON document stays on so the drift check and client generation
# can read it; the interactive UI is opt-in because it is a complete map of the
# attack surface. Set SWAGGER_ENABLED=true locally to browse it.
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html

# ---------------------------------------------------------------------------
# Transactional outbox relay (Phase 09).
#
# Events are written to outbox_events in the business transaction; the relay
# publishes committed rows and retries until the broker confirms. Durations are
# plain milliseconds so @Scheduled and @Value read them without format surprises.
# ---------------------------------------------------------------------------
outbox:
  relay:
    # Off under the test profile, where tests drive relayOnce() explicitly.
    enabled: ${OUTBOX_RELAY_ENABLED:true}
    # fixedDelay, measured from the END of the previous run, so a slow broker
    # cannot stack overlapping polls the way fixedRate would.
    poll-interval-ms: 500
    batch-size: 100
    # How long a claimed row is hidden from other relays. Long enough to publish
    # a whole batch; if the relay dies, the rows come back when it runs out.
    lease-ms: 60000
    # Attempts before DEAD -- counting only failures that are the EVENT's: today,
    # an event no queue will route. A broker that is down, slow or full is not
    # charged to anyone; the relay pauses (1s doubling to 30s) and retries for as
    # long as it takes. Charging those was the first version's mistake: eight
    # attempts at 500ms doubling is about one minute, so a longer outage made
    # every event written in its first minute DEAD. See OutboxRelay.
    max-attempts: 8
    confirm-timeout-ms: 5000
  # PUBLISHED rows are kept this long as an audit of what was emitted, then purged.
  retention-days: 7

# ---------------------------------------------------------------------------
# Dead letters (Phase 09 Task 5).
#
# DeadLetterRecorder copies every message from skillbridge.dlq into
# dead_letter_events and acks it; an admin replays or discards each one
# (/api/v1/admin/dead-letters). docs/RUNBOOK_DLQ.md is the operator's guide.
# ---------------------------------------------------------------------------
dead-letters:
  recorder:
    # Off under the test profile. With it off, dead letters stay in the queue:
    # nothing is lost, they are only not visible.
    enabled: ${DEAD_LETTER_RECORDER_ENABLED:true}
  # REPLAYED and DISCARDED rows are kept this long. PENDING rows are never purged.
  retention-days: 30

# The gauges ops/prometheus/messaging-alerts.yml alerts on. Refreshed on a timer
# rather than queried on scrape; see MessagingMetrics.
messaging:
  backlog-metrics:
    enabled: ${MESSAGING_METRICS_ENABLED:true}
    refresh-ms: 30000
