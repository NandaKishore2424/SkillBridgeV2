# ============================================================================
# Main application configuration
# ============================================================================
# NO SECRET MAY EVER APPEAR IN THIS FILE. Not as a default, not in a comment,
# not "temporarily". This file is committed to git; anything in it is public to
# everyone with repository access, and stays in the history after removal.
#
# Every credential below is read from the environment and has no fallback, so a
# missing variable fails loudly at startup rather than silently starting with a
# known-bad default. See .env.example for the full list.
# ============================================================================

spring:
  application:
    name: skillbridge-backend

  # Active profile. Override with SPRING_PROFILES_ACTIVE.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

    # Hikari defaults assume a connection stays open until Hikari retires it.
    # Supabase sits behind a pooler that closes idle server connections on its
    # own schedule, so a pool left on defaults hands out sockets the server has
    # already dropped. The symptom is a 500 on the first request after an idle
    # period -- "An I/O error occurred while sending to the backend" -- which
    # then succeeds on retry and so reads as a flake rather than a bug.
    hikari:
      # Ping idle connections so a dead one is discovered and replaced by the
      # pool rather than by a user's request. This is the setting that actually
      # fixes the symptom above.
      keepalive-time: 120000      # 2m
      # Retire connections well inside the pooler's idle window rather than
      # Hikari's 30-minute default.
      max-lifetime: 900000        # 15m
      # Inert while minimum-idle == maximum-pool-size (a fixed-size pool never
      # retires an idle connection). It applies again if DB_POOL_MIN is lowered.
      idle-timeout: 300000        # 5m

      # ---- Sizing. Measured 2026-09-09; see docs/CONNECTION_POOL.md ----------
      # The ceiling is not this application's choice. Supabase fronts the
      # database with Supavisor, and this project's pooler allows exactly 15
      # server connections: configured at 30, given a 48-second load with 26
      # requests queued, hikaricp.connections.active never once exceeded 15, and
      # pg_stat_activity agreed. Anything above 15 here is unreachable
      # configuration -- Hikari would queue rather than grow, while advertising
      # capacity that cannot exist.
      #
      # Those 15 are shared. skillbridge-ai-service and the ETL pipeline use the
      # same pooler host, port and role. Their configured maximums were 10 and 1,
      # which with this pool's previous 10 claimed 21 against a ceiling of 15 --
      # already oversubscribed by 40%.
      #
      # 12 is this service's share: it is the only latency-critical, user-facing
      # claimant, and 3 are left for the AI service (best effort, its own code
      # says 2 is plenty) and the ETL script (1, single connection).
      #
      # Fixed size on purpose -- minimum-idle equals maximum-pool-size. Creating
      # a connection to the pooler measured a 1171 ms mean: TCP, TLS, Supavisor
      # auth and Postgres auth, each a round trip to ap-northeast-2. Letting the
      # pool grow on the request path puts that second-plus in a user's latency,
      # so the pool is warm before anyone asks.
      minimum-idle: ${DB_POOL_MIN:12}
      maximum-pool-size: ${DB_POOL_MAX:12}

      # Shed load rather than queue behind an exhausted pool: 30 seconds of
      # waiting is 30 seconds of a held Tomcat thread, which turns a slow
      # service into an unresponsive one.
      #
      # Not the 3000 ms the phase doc suggests. Connection creation measured a
      # 1171 ms mean here, so a 3-second budget leaves under two creation times
      # of headroom, and a request arriving during warm-up or while Hikari
      # replaces a retired connection would fail rather than wait. 5000 is four
      # times the measured creation cost and still six times tighter than the
      # 30 s it replaces.
      connection-timeout: 5000
      validation-timeout: 3000    # must stay under connection-timeout

      # A connection out of the pool for 20 s has been leaked, not used: the
      # slowest single checkout observed under deliberate overload was 4.5 s.
      # This only logs -- it never fails a request -- so a false positive costs
      # a log line, and the alternative is finding leaks by running out.
      leak-detection-threshold: 20000

      # Name the pool so the Micrometer gauges are labelled, and name the JDBC
      # connections so they are attributable on the server. Without
      # ApplicationName every one of our sockets shows up in pg_stat_activity as
      # the driver's default "PostgreSQL JDBC Driver", which is what the AI
      # service and the ETL pipeline are called too -- so on a shared 60-
      # connection server you cannot tell whose connections are holding the
      # ceiling. Measured 2026-09-09: our two idle connections were
      # indistinguishable from any other JDBC client's.
      pool-name: SkillBridgeHikari
      data-source-properties:
        ApplicationName: skillbridge-backend
        # Collapse a batch of INSERTs into one multi-row statement. With every
        # round trip costing ~150 ms to ap-northeast-2, the batch size Hibernate
        # is configured for below is only worth having if the driver sends it as
        # one statement.
        reWriteBatchedInserts: true
        # Server-side prepared statements after 5 executions, cached so the
        # server does not re-plan. Saves a parse/plan round trip on every
        # repeated query, which at this latency is the cost that matters.
        #
        # SAFE ONLY IN SESSION MODE. This connects to the pooler on port 5432,
        # which is Supavisor's session mode: one client connection owns one
        # server connection, so a prepared statement stays where it was made.
        # Port 6543 is transaction mode, where a connection is handed to a
        # different client between statements and named prepared statements
        # break. Changing that port without removing these two lines is a
        # one-character change that fails at runtime, not at startup.
        prepareThreshold: 5
        preparedStatementCacheQueries: 256
        preparedStatementCacheSizeMiB: 5
        # Stream large result sets rather than materialising them in the heap.
        defaultRowFetchSize: 500

  rabbitmq:
    addresses: ${AMQP_URL}

  data:
    web:
      pageable:
        # No controller uses Spring's Pageable resolver today -- they read page
        # and size as request params and go through common.dto.Pagination, which
        # applies the same ceiling. This is here so a controller that does start
        # using Pageable is capped from the first line rather than the second.
        max-page-size: 100
        default-page-size: 20

  jpa:
    # validate, never update. Hibernate must not be allowed to alter the schema.
    #
    # Flyway was removed on 2026-09-05 (personal project, one database, no
    # second environment to reproduce). The schema is now applied directly to
    # Supabase and this setting is the ONLY remaining guard against the code and
    # the database drifting apart -- it is what caught both startup bugs that
    # blocked Phase 00. Do not relax it to `update`: Hibernate will not create
    # the trg_progress_denorm trigger, the partial unique indexes or the CHECK
    # constraints this schema depends on, and it never removes anything.
    #
    # To change the schema: alter the entity, then apply the matching SQL to
    # Supabase in the same change. Startup will tell you if you forgot.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

        # Hibernate's statistics counter, which is how QueryCountAssertion sees
        # how many statements a call emits. It is what makes an N+1 a test
        # failure instead of something you notice in production.
        #
        # On in every profile on purpose. The overhead is a handful of atomic
        # counters -- Hibernate's own docs call it negligible -- and the
        # alternative is a guard that only works where it is already switched
        # on, which is never the environment where the surprise happens. It also
        # feeds the JMX/actuator hibernate metrics for free.
        generate_statistics: true
        # Statistics on their own log a summary per session at INFO, which is
        # noise. The logger is muted in the logging block below; the counters
        # stay live.

logging:
  level:
    # Statistics are collected (see generate_statistics) but the per-session
    # summary Hibernate logs is not wanted in normal output.
    org.hibernate.stat: WARN

jwt:
  secret: ${JWT_SECRET}

  # THIS IS THE REVOCATION WINDOW, not just a session length.
  #
  # Since 2026-09-09 TokenAuthenticationFilter builds the principal from the
  # token's claims instead of reloading the user on every request. That removed a
  # database round trip -- ~150 ms, under every authenticated endpoint, one of the
  # two connection checkouts a request made -- and gave up the property that paid
  # for it: a deactivated user used to lose access on their very next request, and
  # now keeps it until their access token expires.
  #
  # So this number is how long a deactivated or demoted user keeps working. An
  # hour was defensible when the filter re-read the user and this value only
  # controlled how often clients refreshed; it is not defensible as a revocation
  # window. Fifteen minutes bounds it while costing each active client four
  # refreshes an hour, against the one lookup per request it replaces.
  #
  # The bound is real rather than best-effort: /auth/refresh re-reads the user and
  # refuses an inactive one, so a deactivated user cannot extend past the token
  # they already hold.
  #
  # Lower it if that window is too wide; the cost is refresh traffic, and each
  # refresh also rotates the refresh token, so it is two writes rather than a
  # read.
  accessTokenTtlSeconds: ${JWT_ACCESS_TTL:900}      # 15m
  refreshTokenTtlSeconds: ${JWT_REFRESH_TTL:1209600}

rateLimit:
  requestsPerMinute: ${RATE_LIMIT_RPM:120}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        # metrics/prometheus carry the Hikari pool gauges. The one that matters
        # is hikaricp.connections.pending: any sustained non-zero value means
        # requests are queueing for a connection, and it goes non-zero well
        # before anyone reports slowness.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: skillbridge

# OpenAPI. The JSON document stays on so the drift check and client generation
# can read it; the interactive UI is opt-in because it is a complete map of the
# attack surface. Set SWAGGER_ENABLED=true locally to browse it.
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html
