# Profile for the integration tests.
#
# The datasource is NOT set here. As of 2026-09-13 it comes from
# PostgresContainerInitializer, which starts a pgvector/pgvector:pg17 container
# and builds it from db/schema/baseline.sql. Set SKILLBRIDGE_TEST_DB=live to run
# against application-local.yaml instead.
#
# This block used to say the datasource came from application-local "gated on
# DATABASE_URL being set", and that "the gate is deliberate -- without it the
# integration tests skip silently and a green run proves nothing." The gate was
# the thing producing exactly that: with no DATABASE_URL, CI ran `mvn test` and
# reported "Tests run: 169, Skipped: 64, BUILD SUCCESS" on every push. The tests
# are now tiered by the build instead, and they run in CI.
#
# What this profile adds is visibility. When a query-count assertion fails, the
# first question is always "which queries?", and answering it should not require
# editing config and re-running.
# The integration tests sign in over and over; AUTHENTICATION allows five
# attempts a minute on purpose. With the limiter live they were throttled 32
# times in one run, one class took 381 seconds, and the cascade surfaced as
# "Unable to determine Dialect without JDBC metadata" -- connection starvation
# wearing the costume of a flaky link. The filter stays in the chain; only its
# limits are lifted. RateLimitingFilterTest exercises those directly.
rateLimit:
  enabled: false

spring:
  rabbitmq:
    # A test default, because application.yaml's ${AMQP_URL} has none and the
    # only file that set it, application-local.yaml, is gitignored. Nothing in
    # the test suite publishes to a broker; this only has to resolve.
    addresses: amqp://guest:guest@localhost:5672
  datasource:
    hikari:
      # The main pool is fixed at 12 -- this application's share of the 15
      # server connections Supabase's pooler allows the whole project (see
      # docs/CONNECTION_POOL.md). The tests must not inherit that: a test run
      # started while the application is up would ask for 12 more, 24 against a
      # ceiling of 15, and the failures read as flaky tests rather than as a
      # connection ceiling.
      #
      # The integration tests are sequential, so three is generous.
      minimum-idle: 1
      maximum-pool-size: 3

      # Twenty seconds, against five in production, and the difference is
      # deliberate. Production wants to fail fast so a user is not left waiting;
      # a test run wants to survive a slow link, because the alternative is a red
      # suite that says nothing about the code. Opening a connection to
      # ap-northeast-2 measured 1171 ms when the pool was sized (see
      # docs/CONNECTION_POOL.md) and 300-2600 ms on 2026-09-10 while the
      # free-tier instance was throttled -- at which point five seconds is not
      # much more than one attempt, and the failures arrive as
      # "Unable to determine Dialect without JDBC metadata", which reads like a
      # driver fault rather than a slow network.
      connection-timeout: 20000

  jpa:
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

logging:
  level:
    # The SQL, and the parameters bound into it. `jdbc.bind` at TRACE is the
    # setting that turns a log full of `?` into something you can paste into
    # psql -- without it, reading a failure means guessing at the values.
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.stat: DEBUG

# ---------------------------------------------------------------------------
# JWT signing key, FOR TESTS ONLY.
#
# application.yaml says `secret: ${JWT_SECRET}` with no default, and the one
# file that supplied it -- application-local.yaml -- is gitignored. So on a
# clean checkout, which is exactly what CI is, every Spring context failed with
# "Could not resolve placeholder 'JWT_SECRET'": 58 of 64 integration tests
# errored. Found 2026-09-14 by building a clean git worktree; nothing had been
# pushed, so CI had never run and the previous handover's claim that the
# integration tier "runs in CI" was untested and wrong.
#
# This is not a secret. It signs tokens inside the test JVM and nowhere else, it
# is the base64 of a string that says so, and it is the same length (48 bytes)
# as the real key so the signing algorithm the code selects is unchanged.
# ---------------------------------------------------------------------------
jwt:
  secret: dGVzdC1vbmx5LWp3dC1zaWduaW5nLWtleS1ub3QtYS1yZWFsLXNlY3JldC0wMDAw

# ---------------------------------------------------------------------------
# The outbox relay is OFF under the test profile.
#
# Left on, it would poll every 500ms inside every Spring context, claiming any
# outbox row a test wrote and racing that test's own assertions about it.
# OutboxRelayBrokerTest builds its relays by hand around a broker it controls
# and drives relayOnce() explicitly, which is the only way its assertions about
# attempts, retries and DEAD can be deterministic.
# ---------------------------------------------------------------------------
outbox:
  relay:
    enabled: false

# ---------------------------------------------------------------------------
# Also off under the test profile, for the same reason and one more.
#
# The recorder would open a connection to localhost:5672 in every Spring context
# -- on a developer machine that is a real broker, whose DLQ it would drain into
# the test database. DeadLetterRecorderBrokerTest turns it on against a broker it
# owns. The metrics refresh would run COUNT(*)s in the background, which Hibernate
# statistics do not see but a query-count assertion's timing might.
# ---------------------------------------------------------------------------
dead-letters:
  recorder:
    enabled: false

messaging:
  backlog-metrics:
    enabled: false

app:
  # Off for the reason the outbox relay is: its background UPDATE lands in the
  # statement count of whichever test is measuring. CsvImportTest sweeps by hand.
  import:
    sweeper:
      enabled: false
  mail:
    # Tests activate `local` too, and a developer's application-local.yaml may
    # point mail at a real SMTP server. Nothing is sent from a test unless the
    # class asks for it (InvitationEmailTest runs its own Mailpit).
    provider: LOG
