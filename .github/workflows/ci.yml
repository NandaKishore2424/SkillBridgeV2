name: CI

# Three checks, in the order they are cheapest to run. The drift check comes
# first: it needs no build at all and catches the class of bug that produced
# twenty phantom endpoints, so there is no reason to spend five minutes on Maven
# before finding out the frontend calls something that does not exist.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-drift:
    name: API contract drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Frontend calls must resolve to backend endpoints
        run: ./scripts/check-api-drift.sh

  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      # The FAST TIER: unit and architecture tests, no database, no Spring
      # context. `clean` matters -- Surefire leaves reports for classes it did
      # not run, and the budget check below refuses to total a mixed directory.
      #
      # This step used to be `./mvnw -B test` against a suite where eighteen
      # classes gated themselves on DATABASE_URL. With no such variable it
      # reported "Tests run: 169, Failures: 0, Errors: 0, Skipped: 64" and BUILD
      # SUCCESS in 6.4 seconds, on every push since this workflow was written.
      # 38% of the suite -- the tenant filter, token revocation, idempotency,
      # the query-count budget -- never ran here, and nothing said so. The tier
      # split means this step now runs 108 tests and skips none, and
      # SuiteTieringTest fails the build if a test starts gating itself again.
      - name: Fast tier
        working-directory: skillbridge-backend
        run: ./mvnw -B clean test

      # Enforces the 30s budget and, more importantly, that nothing was skipped.
      # The annotation guard lives in the suite; this asserts the outcome.
      - name: Fast tier budget and zero-skip
        run: ./scripts/check-test-budget.sh

  integration:
    name: Backend integration tier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # The 64 tests that need a real PostgreSQL. Until 2026-09-13 they could
      # not run here at all: they need pgvector, pg_trgm, generated columns and
      # partial GIN indexes, H2 has none of those, and the only database that
      # did was the live Supabase project -- whose pooler allows this whole
      # project 15 connections and whose credentials are not in CI.
      #
      # What unblocked it was not Testcontainers. It was having a schema at all.
      # Flyway was removed on 2026-09-06 and the schema then existed in exactly
      # one place: inside the live database. db/schema/baseline.sql is that
      # schema, captured and diff-verified against live (551 catalogue objects,
      # identical digests on live and on pgvector/pgvector:pg17), and
      # PostgresContainerInitializer builds each run's database from it.
      #
      # Docker is available on ubuntu-latest, so Testcontainers needs no setup.
      #
      # `verify` also runs the JaCoCo coverage check, on the MERGED data from
      # both tiers. It is here rather than in the fast-tier job because a
      # unit-only number understates coverage badly: most service and
      # repository code is exercised by this tier. The threshold is a ratchet
      # just under what is measured (34.9% line, 27.4% branch on 2026-09-14),
      # not Phase 11's 80/70 -- see the comment in pom.xml.
      - name: Integration tier and coverage gate
        working-directory: skillbridge-backend
        run: ./mvnw -B clean verify

  mutation:
    name: Mutation testing (domain logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # Coverage says a line ran. Mutation testing says a test would NOTICE if
      # the line were wrong: PIT flips conditions and swaps return values and
      # checks that something fails. A line can be fully covered by a test that
      # asserts nothing.
      #
      # Scoped to pure logic with fast unit tests -- the state machines, the
      # tenancy check, the paging envelope, the sort parser -- so it needs no
      # database and finishes in about a minute. Over Spring services it would
      # re-run the integration tier once per mutant.
      #
      # Threshold 89 against a measured 90% (35 of 39). The 4 survivors are
      # equivalent mutants that no test can kill; see the comment in pom.xml
      # before "fixing" them.
      - name: PIT
        working-directory: skillbridge-backend
        run: ./mvnw -B test-compile org.pitest:pitest-maven:mutationCoverage

  ai-contract:
    name: AI event contract (Python consumer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Only jsonschema. The consumer's contract module is deliberately free of
      # dependencies so this job does not need fastapi, pika or
      # sentence-transformers -- a model download to assert four string literals
      # is why these literals went untested long enough to break.
      - name: Install
        run: pip install "jsonschema>=4"

      # The Java half runs in the backend job (AiEventContractTest). Both are
      # checked against contracts/ai-events/v1/ai-event.schema.json, so neither
      # language can change the wire format alone.
      - name: Contract test
        working-directory: skillbridge-ai-service
        run: python -m unittest discover -s tests -t . -v

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: skillbridge-frontend/package-lock.json
      - name: Install
        working-directory: skillbridge-frontend
        run: npm ci
      - name: Build
        working-directory: skillbridge-frontend
        # `npm run build` is `tsc -b && vite build`. Use it rather than `tsc
        # --noEmit`: the two disagree, because tsc -b honours the project
        # references in tsconfig.json and --noEmit silently checks almost
        # nothing here. A previous session reported "typecheck clean" from
        # --noEmit while the build had 117 errors.
        #
        # This also type-checks the test files, because tsconfig.app.json
        # includes all of `src`. That is deliberate: it caught an unused import
        # in a test on the first run, and it means a test cannot rot into
        # something that no longer compiles while the suite still passes.
        run: npm run build

      # The frontend had no test runner at all until 2026-09-13. Every guarantee
      # came from tsc and the drift script, neither of which can tell you that
      # concurrent 401s log the user out.
      #
      # The coverage threshold is a ratchet set just under what is measured, not
      # the 70% Phase 11 asks for. It stops coverage falling; it does not claim
      # the frontend is well covered. See vitest.config.ts.
      - name: Test
        working-directory: skillbridge-frontend
        run: npm run test:coverage
