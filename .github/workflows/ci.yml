name: CI

# Three checks, in the order they are cheapest to run. The drift check comes
# first: it needs no build at all and catches the class of bug that produced
# twenty phantom endpoints, so there is no reason to spend five minutes on Maven
# before finding out the frontend calls something that does not exist.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-drift:
    name: API contract drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Frontend calls must resolve to backend endpoints
        run: ./scripts/check-api-drift.sh

  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      # The FAST TIER: unit and architecture tests, no database, no Spring
      # context. `clean` matters -- Surefire leaves reports for classes it did
      # not run, and the budget check below refuses to total a mixed directory.
      #
      # This step used to be `./mvnw -B test` against a suite where eighteen
      # classes gated themselves on DATABASE_URL. With no such variable it
      # reported "Tests run: 169, Failures: 0, Errors: 0, Skipped: 64" and BUILD
      # SUCCESS in 6.4 seconds, on every push since this workflow was written.
      # 38% of the suite -- the tenant filter, token revocation, idempotency,
      # the query-count budget -- never ran here, and nothing said so. The tier
      # split means this step now runs 108 tests and skips none, and
      # SuiteTieringTest fails the build if a test starts gating itself again.
      - name: Fast tier
        working-directory: skillbridge-backend
        run: ./mvnw -B clean test

      # Enforces the 30s budget and, more importantly, that nothing was skipped.
      # The annotation guard lives in the suite; this asserts the outcome.
      - name: Fast tier budget and zero-skip
        run: ./scripts/check-test-budget.sh

  integration:
    name: Backend integration tier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # The 64 tests that need a real PostgreSQL. Until 2026-09-13 they could
      # not run here at all: they need pgvector, pg_trgm, generated columns and
      # partial GIN indexes, H2 has none of those, and the only database that
      # did was the live Supabase project -- whose pooler allows this whole
      # project 15 connections and whose credentials are not in CI.
      #
      # What unblocked it was not Testcontainers. It was having a schema at all.
      # Flyway was removed on 2026-09-06 and the schema then existed in exactly
      # one place: inside the live database. db/schema/baseline.sql is that
      # schema, captured and diff-verified against live (551 catalogue objects,
      # identical digests on live and on pgvector/pgvector:pg17), and
      # PostgresContainerInitializer builds each run's database from it.
      #
      # Docker is available on ubuntu-latest, so Testcontainers needs no setup.
      - name: Integration tier
        working-directory: skillbridge-backend
        run: ./mvnw -B clean verify

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: skillbridge-frontend/package-lock.json
      - name: Install
        working-directory: skillbridge-frontend
        run: npm ci
      - name: Build
        working-directory: skillbridge-frontend
        # `npm run build` is `tsc -b && vite build`. Use it rather than `tsc
        # --noEmit`: the two disagree, because tsc -b honours the project
        # references in tsconfig.json and --noEmit silently checks almost
        # nothing here. A previous session reported "typecheck clean" from
        # --noEmit while the build had 117 errors.
        run: npm run build
